<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf8">
    <title>HTML Calculator</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <button id="one">1</button>
    <button id="two">2</button>
    <button id="three">3</button>
    <button id="four">4</button>
    <button id="five">5</button>
    <button id="six">6</button>
    <button id="seven">7</button>
    <button id="eight">8</button>
    <button id="nine">9</button>
    <button id="zero">0</button>
    <button id="backspace">Remove last number</button>
    <button id="add">+</button>
    <button id="multiply">*</button>
    <button id="divide">÷</button>
    <button id="subtract">-</button>
    <button id="exponential">^</button>
    <button id="leftpar">(</button>
    <button id="rightpar">)</button>
    <p>Equation: <span id=equation"></span></p>
    <output id="result"></output>
    <fieldset>
      <input type="radio" id="intmode" name="numbermode" value="intmode"><label for="intmode">Integer Mode</label>
      <input type="radio" id="floatmode" name="numbermode" value="floatmode"><label for="floatmode">Decimal Mode</label>
    </fieldset>
    <script src="script.js"></script>
  </body>
</html>
